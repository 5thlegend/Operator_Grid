<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NRO · Operator Core</title>
<meta name="description" content="Operator Core. Deploy in public. Earn the rank. — Next Realm Operators"/>
<meta property="og:title" content="NRO · Operator Core"/>
<meta property="og:description" content="Builders don't post. Operators deploy."/>
<meta property="og:type" content="website"/>
<link rel="preconnect" href="https://api.mapbox.com"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet"/>
<style>
:root {
  --bg:#0a0a0a; --surface:#111114; --s2:#16161b; --s3:#1c1c22;
  --line:#26262e; --line2:#34343e;
  --text:#e6e6ea; --dim:#9a9aa3; --mute:#5a5a64;
  --glow:#67e8f9; --glowsoft:rgba(103,232,249,.18);
  --gold:#fbbf24; --violet:#a78bfa; --danger:#f87171;
  --font:Inter,ui-sans-serif,system-ui,sans-serif;
  --display:'Space Grotesk',Inter,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; -webkit-font-smoothing:antialiased; }
body {
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(103,232,249,.08), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(167,139,250,.05), transparent 60%);
  background-attachment:fixed;
}
::selection { background:rgba(103,232,249,.25); color:#fff; }
*:focus-visible { outline:1px solid var(--glow); outline-offset:2px; }
a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }
input,textarea,select { font:inherit; }

.grid-overlay { position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size: 56px 56px,56px 56px,14px 14px,14px 14px;
  opacity:.5;
}
.scan { position:fixed; inset:0; pointer-events:none; z-index:0;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
}
.app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

/* NAV */
.nav { position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
  background:rgba(10,10,10,.85); border-bottom:1px solid var(--line); }
.nav-inner { max-width:1280px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:24px; height:56px; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark { display:grid; place-items:center; width:28px; height:28px; border:1px solid rgba(103,232,249,.6); color:var(--glow); font-family:var(--mono); font-size:11px; letter-spacing:3px; }
.brand-text { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--dim); }
.brand-text .v { color:var(--mute); }
.nav a.nav-link { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; padding:6px 12px; }
.nav a.nav-link:hover { color:var(--glow); }
.nav .spacer { flex:1; }
.btn { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:3px; padding:8px 14px; border:1px solid; background:transparent; color:var(--dim); cursor:pointer; transition:.15s; }
.btn:hover { color:var(--text); border-color:var(--dim); }
.btn-glow { border-color:rgba(103,232,249,.6); background:var(--glowsoft); color:var(--glow); }
.btn-glow:hover { background:rgba(103,232,249,.2); color:var(--glow); border-color:var(--glow); }
.btn-primary { border-color:var(--glow); background:var(--glowsoft); color:var(--glow); padding:12px 22px; font-size:12px; }
.btn-primary:hover { background:rgba(103,232,249,.2); }
.btn-block { width:100%; justify-content:center; }

/* HUD */
.panel { position:relative; border:1px solid var(--line); background:rgba(17,17,20,.7); backdrop-filter:blur(8px); }
.panel.corners::before,.panel.corners::after { content:""; position:absolute; width:12px; height:12px; border:1px solid var(--glow); opacity:.55; }
.panel.corners::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
.panel.corners::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }
.panel.glow { box-shadow:0 0 42px -22px rgba(103,232,249,.6); }
.panel-head { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line); }
.panel-head .lbl { font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--glow); }
.panel-head .hint { font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--mute); }

.stat { display:flex; flex-direction:column; gap:6px; padding:16px; }
.stat .lbl { font-family:var(--mono); font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); }
.stat .val { font-family:var(--mono); font-size:26px; color:var(--text); }
.stat .val.glow { color:var(--glow); text-shadow:0 0 18px rgba(103,232,249,.4); }
.stat .val.gold { color:var(--gold); }
.stat .hint { font-family:var(--mono); font-size:10px; color:var(--dim); }

.tag { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--glow); }
.tag .dot { width:8px; height:8px; border-radius:50%; background:var(--glow); animation:pulse 1.6s infinite ease-in-out; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
@keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.marquee-wrap { position:relative; overflow:hidden; }
.marquee { display:flex; gap:32px; white-space:nowrap; animation:marquee 60s linear infinite; }
.marquee-wrap::before,.marquee-wrap::after { content:""; position:absolute; top:0; bottom:0; width:60px; pointer-events:none; }
.marquee-wrap::before { left:0; background:linear-gradient(to right,var(--bg),transparent); }
.marquee-wrap::after { right:0; background:linear-gradient(to left,var(--bg),transparent); }

/* RANK */
.rank-badge { display:inline-flex; align-items:center; gap:6px; border:1px solid; padding:3px 10px; font-family:var(--mono); font-size:10px; letter-spacing:3px; text-transform:uppercase; background:rgba(0,0,0,.3); }
.rank-badge .pip { width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.6s infinite; }
.rank-INITIATE { color:#a1a1aa; border-color:rgba(161,161,170,.5); }
.rank-OPERATOR { color:#67e8f9; border-color:rgba(103,232,249,.4); box-shadow:0 0 22px -4px rgba(103,232,249,.5); }
.rank-ARCHITECT { color:#67e8f9; border-color:rgba(103,232,249,.6); box-shadow:0 0 28px -4px rgba(103,232,249,.6); }
.rank-COMMANDER { color:#fbbf24; border-color:rgba(252,211,77,.6); box-shadow:0 0 32px -4px rgba(252,211,77,.6); }
.rank-SOVEREIGN { color:#fcd34d; border-color:rgba(252,211,77,.8); box-shadow:0 0 42px -2px rgba(252,211,77,.7); }

.kind-badge { display:inline-flex; align-items:center; padding:3px 8px; border:1px solid; font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; }
.kind-iteration { color:#a1a1aa; border-color:rgba(161,161,170,.5); background:rgba(63,63,70,.3); }
.kind-ship { color:#67e8f9; border-color:rgba(103,232,249,.5); background:rgba(103,232,249,.1); }
.kind-milestone { color:#a78bfa; border-color:rgba(167,139,250,.5); background:rgba(167,139,250,.1); }
.kind-launch { color:#fbbf24; border-color:rgba(252,211,77,.6); background:rgba(252,211,77,.1); box-shadow:0 0 28px -6px rgba(252,211,77,.5); }

/* AVATAR */
.avatar { display:grid; place-items:center; overflow:hidden; flex-shrink:0; background:var(--s2); }
.avatar.ring { box-shadow: inset 0 0 0 1px rgba(103,232,249,.4); }

/* PAGE LAYOUTS */
.container { max-width:1280px; margin:0 auto; padding:0 24px; width:100%; }
.center { max-width:540px; margin:0 auto; padding:64px 24px; width:100%; }
.hero h1 { font-family:var(--display); font-size:clamp(48px,8vw,84px); font-weight:700; line-height:.95; letter-spacing:-2px; margin:24px 0 24px; max-width:18ch; }
.hero h1 .glow { color:var(--glow); text-shadow:0 0 26px rgba(103,232,249,.45); }
.hero p { color:var(--dim); line-height:1.6; font-size:17px; max-width:620px; margin:0 0 32px; }
.hero-cta { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:48px; }

.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
.stats-row > .stat { background:var(--surface); }
@media (max-width:768px) { .stats-row { grid-template-columns:repeat(2,1fr); } .nav-inner { padding:8px 16px; gap:12px; } .nav-link { display:none; } }

.doctrine { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:96px; }
.doctrine .card { padding:24px; }
.doctrine h3 { font-family:var(--display); font-size:24px; margin:16px 0 8px; }
.doctrine p { color:var(--dim); font-size:14px; line-height:1.6; margin:0; }
@media (max-width:768px) { .doctrine { grid-template-columns:1fr; } }

.feed-item { padding:14px 16px; border-bottom:1px solid var(--line); transition:.15s; }
.feed-item:hover { background:var(--s2); }
.feed-item:last-child { border-bottom:0; }
.feed-item .row1 { display:flex; align-items:center; gap:8px; font-size:12px; }
.feed-item .row1 .h { font-family:var(--mono); color:var(--text); }
.feed-item .row1 .at { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--mute); }
.feed-item .title { margin-top:8px; font-family:var(--display); font-size:17px; color:var(--text); line-height:1.3; }
.feed-item .desc { margin-top:4px; color:var(--dim); font-size:13px; line-height:1.5; }

.row { display:flex; align-items:center; gap:12px; padding:12px 16px; transition:.15s; }
.row:hover { background:var(--s2); }
.row .rank-num { width:30px; font-family:var(--mono); font-size:12px; color:var(--mute); }
.row .name { font-family:var(--display); font-size:16px; color:var(--text); }
.row .handle { font-family:var(--mono); font-size:12px; color:var(--mute); }
.row .meta { display:flex; align-items:center; gap:12px; margin-top:4px; }
.row .right { text-align:right; }
.row .right .num { font-family:var(--mono); font-size:18px; color:var(--glow); }
.row .right .sub { font-family:var(--mono); font-size:9px; color:var(--mute); letter-spacing:2px; }

.grid-two { display:grid; gap:24px; grid-template-columns:1fr 1.1fr; }
@media (max-width:900px) { .grid-two { grid-template-columns:1fr; } }

/* FORM */
.field { display:block; margin-bottom:16px; }
.field .lbl { font-family:var(--mono); font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); margin-bottom:6px; display:block; }
.input,.textarea,.select { width:100%; background:rgba(0,0,0,.4); border:1px solid var(--line2); color:var(--text); padding:10px 12px; font-family:inherit; font-size:14px; }
.input:focus,.textarea:focus,.select:focus { border-color:var(--glow); outline:none; }
.textarea { resize:vertical; min-height:90px; }

/* FOOTER */
.footer { padding:48px 24px; border-top:1px solid var(--line); margin-top:96px; }
.footer .inner { max-width:1280px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--mute); }

/* MAP PAGE */
.map-app { display:grid; grid-template-rows:48px 1fr 36px; grid-template-columns:260px 1fr 280px; height:100vh; overflow:hidden; }
.map-app .header { grid-column:1/-1; display:flex; align-items:center; gap:16px; padding:0 18px; background:rgba(10,10,10,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.map-app .feed { grid-row:2; grid-column:1; border-right:1px solid var(--line); overflow-y:auto; background:rgba(10,10,10,.8); }
.map-app .mapwrap { grid-row:2; grid-column:2; position:relative; }
.map-app .ranks { grid-row:2; grid-column:3; border-left:1px solid var(--line); overflow-y:auto; background:rgba(10,10,10,.8); }
.map-app .telemetry { grid-column:1/-1; display:flex; align-items:center; gap:20px; padding:0 18px; background:rgba(10,10,10,.85); border-top:1px solid var(--line); font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); }
.map-app .telemetry .glow { color:var(--glow); }
.map-app .panel-head { padding:8px 14px; }
@media (max-width:1024px) { .map-app { grid-template-columns:1fr; grid-template-rows:48px 200px 1fr 36px; } .map-app .feed { grid-row:2; grid-column:1; border-right:0; border-bottom:1px solid var(--line); } .map-app .mapwrap { grid-row:3; grid-column:1; } .map-app .ranks { display:none; } }

#map { position:absolute; inset:0; }
.map-app .mapwrap::after { content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 60%, rgba(10,10,10,.85) 100%); z-index:2; }

.marker {
  position:absolute; pointer-events:auto; cursor:pointer;
  width:28px; height:28px;
}
.marker .pulse { position:absolute; inset:0; border-radius:50%; }
.marker .core { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; }
.marker .ring { position:absolute; inset:0; border-radius:50%; border:1px solid; opacity:.85; }
.marker .label { position:absolute; left:50%; top:100%; margin-top:6px; transform:translateX(-50%); white-space:nowrap; font-family:var(--mono); font-size:10px; letter-spacing:2px; opacity:0; pointer-events:none; transition:.15s; }
.marker:hover .label { opacity:1; }

.pulse-ring { position:absolute; pointer-events:none; border-radius:50%; border:1px solid; transform:translate(-50%,-50%); }
.pulse-burst { position:absolute; pointer-events:none; left:0; top:0; width:12px; height:12px; margin-left:-6px; margin-top:-6px; border-radius:50%; }

.tt { position:absolute; pointer-events:none; z-index:30; width:280px; background:rgba(10,10,10,.95); backdrop-filter:blur(8px); border:1px solid rgba(103,232,249,.4); padding:14px; box-shadow:0 0 42px -12px rgba(103,232,249,.6); }
.tt-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:var(--mono); font-size:10px; color:var(--glow); letter-spacing:2px; }
.tt-name { font-family:var(--display); font-size:18px; }
.tt-handle { font-family:var(--mono); font-size:11px; color:var(--mute); margin-bottom:10px; }
.tt-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-family:var(--mono); font-size:10px; }
.tt-grid > div { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid rgba(38,38,46,.5); }
.tt-grid .v { color:var(--text); }
.tt-grid .va { color:var(--glow); }

/* ASCENSION */
.asc-overlay { position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(0,0,0,.75); animation:fadein .4s; }
.asc-card { position:relative; max-width:480px; padding:48px 56px; border:1px solid var(--glow); background:rgba(10,10,10,.95); text-align:center; box-shadow:0 0 120px -10px rgba(103,232,249,.6); }
.asc-burst { position:absolute; left:50%; top:50%; width:50vmin; height:50vmin; border-radius:50%; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(103,232,249,.4), transparent 70%); animation:burst 1.6s ease-out forwards; pointer-events:none; }
@keyframes burst { from{transform:translate(-50%,-50%) scale(.4); opacity:0} 25%{opacity:1} to{transform:translate(-50%,-50%) scale(2.5); opacity:0} }
@keyframes fadein { from{opacity:0} to{opacity:1} }
.asc-card .tag { display:block; font-family:var(--mono); font-size:11px; color:var(--glow); letter-spacing:4px; }
.asc-card .name { font-family:var(--display); font-size:32px; font-weight:700; margin:16px 0 4px; }
.asc-card .lbl { font-family:var(--mono); font-size:11px; color:var(--mute); letter-spacing:3px; margin-top:24px; }
.asc-card .rank { font-family:var(--mono); font-size:36px; letter-spacing:8px; margin-top:6px; }

/* TOAST */
.toast { position:fixed; bottom:24px; right:24px; z-index:60; background:rgba(10,10,10,.95); border:1px solid var(--glow); padding:12px 18px; font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--glow); box-shadow:0 0 32px -10px rgba(103,232,249,.6); }

.divider { height:1px; background:linear-gradient(to right, transparent, var(--line2), transparent); margin:24px 0; }
.glow-text { text-shadow:0 0 18px rgba(103,232,249,.4); }

/* PROGRESS */
.progress { height:4px; background:var(--s3); overflow:hidden; }
.progress > .bar { height:100%; background:linear-gradient(to right, var(--glow), var(--gold)); transition:width .5s; }
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="scan"></div>
<div id="app"></div>

<script>
window.__NRO_ENV = {
  SUPABASE_URL: "__SUPABASE_URL__",
  SUPABASE_ANON_KEY: "__SUPABASE_ANON_KEY__",
  MAPBOX_TOKEN: "__MAPBOX_TOKEN__",
  SITE_URL: "__SITE_URL__"
};
</script>
<script type="module" src="/app.js"></script>
</body></html>
