<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NRO · Operator Core</title>
<meta name="description" content="Operator Core. Deploy in public. Earn the rank. — Next Realm Operators"/>
<meta property="og:title" content="NRO · Operator Core"/>
<meta property="og:description" content="Builders don't post. Operators deploy."/>
<meta property="og:type" content="website"/>
<link rel="preconnect" href="https://api.mapbox.com"/>
<link rel="preconnect" href="https://esm.sh" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="modulepreload" href="https://esm.sh/preact@10.24.3"/>
<link rel="modulepreload" href="https://esm.sh/preact@10.24.3/hooks"/>
<link rel="modulepreload" href="https://esm.sh/htm@3.1.1"/>
<link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2.47.10"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet"/>
<style>
:root {
  --bg:#0a0a0a; --surface:#111114; --s2:#16161b; --s3:#1c1c22;
  --line:#26262e; --line2:#34343e;
  --text:#e6e6ea; --dim:#9a9aa3; --mute:#5a5a64;
  --glow:#67e8f9; --glowsoft:rgba(103,232,249,.18);
  --gold:#fbbf24; --violet:#a78bfa; --danger:#f87171;
  --font:Inter,ui-sans-serif,system-ui,sans-serif;
  --display:'Space Grotesk',Inter,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; -webkit-font-smoothing:antialiased; }
body {
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(103,232,249,.08), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(167,139,250,.05), transparent 60%);
  background-attachment:fixed;
}
::selection { background:rgba(103,232,249,.25); color:#fff; }
*:focus-visible { outline:1px solid var(--glow); outline-offset:2px; }
a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }
input,textarea,select { font:inherit; }
input:focus-visible,textarea:focus-visible,select:focus-visible { outline:1px solid var(--glow); outline-offset:1px; box-shadow:0 0 0 3px rgba(103,232,249,.12); }
button:focus-visible,a:focus-visible { outline:1px solid var(--glow); outline-offset:2px; }
fieldset[disabled] { opacity:0.65; }

.grid-overlay { position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px);
  background-size: 56px 56px,56px 56px,14px 14px,14px 14px;
  opacity:.45;
}
.scan { position:fixed; inset:0; pointer-events:none; z-index:0;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
}
.app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }

/* NAV */
.nav { position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
  background:rgba(10,10,10,.85); border-bottom:1px solid var(--line); }
.nav-inner { max-width:1280px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:24px; height:56px; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark { display:grid; place-items:center; width:28px; height:28px; border:1px solid rgba(103,232,249,.6); color:var(--glow); font-family:var(--mono); font-size:11px; letter-spacing:3px; }
.brand-text { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--dim); }
.brand-text .v { color:var(--mute); }
.nav a.nav-link { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; padding:6px 12px; }
.nav a.nav-link:hover { color:var(--glow); }
.nav .spacer { flex:1; }
.btn { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:3px; padding:8px 14px; border:1px solid; background:transparent; color:var(--dim); cursor:pointer; transition:.15s; }
.btn:hover { color:var(--text); border-color:var(--dim); }
.btn-glow { border-color:rgba(103,232,249,.6); background:var(--glowsoft); color:var(--glow); }
.btn-glow:hover { background:rgba(103,232,249,.2); color:var(--glow); border-color:var(--glow); }
.btn-primary { border-color:var(--glow); background:var(--glowsoft); color:var(--glow); padding:12px 22px; font-size:12px; }
.btn-primary:hover { background:rgba(103,232,249,.2); }
.btn-block { width:100%; justify-content:center; }

/* HUD */
.panel { position:relative; border:1px solid var(--line); background:rgba(17,17,20,.7); backdrop-filter:blur(8px); }
.panel.corners::before,.panel.corners::after { content:""; position:absolute; width:12px; height:12px; border:1px solid var(--glow); opacity:.55; }
.panel.corners::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
.panel.corners::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }
.panel.glow { box-shadow:0 0 42px -22px rgba(103,232,249,.6); }
.panel-head { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line); }
.panel-head .lbl { font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--glow); }
.panel-head .hint { font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--mute); }

.stat { display:flex; flex-direction:column; gap:6px; padding:16px; }
.stat .lbl { font-family:var(--mono); font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); }
.stat .val { font-family:var(--mono); font-size:26px; color:var(--text); }
.stat .val.glow { color:var(--glow); text-shadow:0 0 18px rgba(103,232,249,.4); }
.stat .val.gold { color:var(--gold); }
.stat .hint { font-family:var(--mono); font-size:10px; color:var(--dim); }

.tag { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--glow); }
.tag .dot { width:8px; height:8px; border-radius:50%; background:var(--glow); animation:pulse 1.6s infinite ease-in-out; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
@keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.marquee-wrap { position:relative; overflow:hidden; }
.marquee { display:flex; gap:32px; white-space:nowrap; animation:marquee 60s linear infinite; }
.marquee-wrap::before,.marquee-wrap::after { content:""; position:absolute; top:0; bottom:0; width:60px; pointer-events:none; }
.marquee-wrap::before { left:0; background:linear-gradient(to right,var(--bg),transparent); }
.marquee-wrap::after { right:0; background:linear-gradient(to left,var(--bg),transparent); }

/* Accessibility: respect prefers-reduced-motion. Strip decorative motion. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .marquee, .pulse, .nro-pulse, .nro-marquee { animation: none !important; }
}

/* RANK */
.rank-badge { display:inline-flex; align-items:center; gap:6px; border:1px solid; padding:3px 10px; font-family:var(--mono); font-size:10px; letter-spacing:3px; text-transform:uppercase; background:rgba(0,0,0,.3); }
.rank-badge .pip { width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.6s infinite; }
.rank-INITIATE { color:#a1a1aa; border-color:rgba(161,161,170,.5); }
.rank-OPERATOR { color:#67e8f9; border-color:rgba(103,232,249,.4); box-shadow:0 0 22px -4px rgba(103,232,249,.5); }
.rank-ARCHITECT { color:#67e8f9; border-color:rgba(103,232,249,.6); box-shadow:0 0 28px -4px rgba(103,232,249,.6); }
.rank-COMMANDER { color:#fbbf24; border-color:rgba(252,211,77,.6); box-shadow:0 0 32px -4px rgba(252,211,77,.6); }
.rank-SOVEREIGN { color:#fcd34d; border-color:rgba(252,211,77,.8); box-shadow:0 0 42px -2px rgba(252,211,77,.7); }

.kind-badge { display:inline-flex; align-items:center; padding:3px 8px; border:1px solid; font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; }
.kind-iteration { color:#a1a1aa; border-color:rgba(161,161,170,.5); background:rgba(63,63,70,.3); }
.kind-ship { color:#67e8f9; border-color:rgba(103,232,249,.5); background:rgba(103,232,249,.1); }
.kind-milestone { color:#a78bfa; border-color:rgba(167,139,250,.5); background:rgba(167,139,250,.1); }
.kind-launch { color:#fbbf24; border-color:rgba(252,211,77,.6); background:rgba(252,211,77,.1); box-shadow:0 0 28px -6px rgba(252,211,77,.5); }

/* AVATAR */
.avatar { display:grid; place-items:center; overflow:hidden; flex-shrink:0; background:var(--s2); }
.avatar.ring { box-shadow: inset 0 0 0 1px rgba(103,232,249,.4); }

/* PAGE LAYOUTS */
.container { max-width:1280px; margin:0 auto; padding:0 24px; width:100%; }
.center { max-width:540px; margin:0 auto; padding:64px 24px; width:100%; }
.hero h1 { font-family:var(--display); font-size:clamp(48px,8vw,84px); font-weight:700; line-height:.95; letter-spacing:-2px; margin:24px 0 24px; max-width:18ch; }
.hero h1 .glow { color:var(--glow); text-shadow:0 0 26px rgba(103,232,249,.45); }
.hero p { color:var(--dim); line-height:1.6; font-size:17px; max-width:620px; margin:0 0 32px; }
.hero-cta { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:48px; }

.stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
.stats-row > .stat { background:var(--surface); }
@media (max-width:768px) { .stats-row { grid-template-columns:repeat(2,1fr); } .nav-inner { padding:8px 16px; gap:12px; } .nav-link { display:none; } }

.doctrine { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:96px; }
.doctrine .card { padding:24px; }
.doctrine h3 { font-family:var(--display); font-size:24px; margin:16px 0 8px; }
.doctrine p { color:var(--dim); font-size:14px; line-height:1.6; margin:0; }
@media (max-width:768px) { .doctrine { grid-template-columns:1fr; } }

.feed-item { padding:14px 16px; border-bottom:1px solid var(--line); transition:.15s; }
.feed-item:hover { background:var(--s2); }
.feed-item:last-child { border-bottom:0; }
.feed-item .row1 { display:flex; align-items:center; gap:8px; font-size:12px; }
.feed-item .row1 .h { font-family:var(--mono); color:var(--text); }
.feed-item .row1 .at { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--mute); }
.feed-item .title { margin-top:8px; font-family:var(--display); font-size:17px; color:var(--text); line-height:1.3; }
.feed-item .desc { margin-top:4px; color:var(--dim); font-size:13px; line-height:1.5; }

.row { display:flex; align-items:center; gap:12px; padding:12px 16px; transition:.15s; }
.row:hover { background:var(--s2); }
.row .rank-num { width:30px; font-family:var(--mono); font-size:12px; color:var(--mute); }
.row .name { font-family:var(--display); font-size:16px; color:var(--text); }
.row .handle { font-family:var(--mono); font-size:12px; color:var(--mute); }
.row .meta { display:flex; align-items:center; gap:12px; margin-top:4px; }
.row .right { text-align:right; }
.row .right .num { font-family:var(--mono); font-size:18px; color:var(--glow); }
.row .right .sub { font-family:var(--mono); font-size:9px; color:var(--mute); letter-spacing:2px; }

.grid-two { display:grid; gap:24px; grid-template-columns:1fr 1.1fr; }
@media (max-width:900px) { .grid-two { grid-template-columns:1fr; } }

/* FORM */
.field { display:block; margin-bottom:16px; }
.field .lbl { font-family:var(--mono); font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); margin-bottom:6px; display:block; }
.input,.textarea,.select { width:100%; background:rgba(0,0,0,.4); border:1px solid var(--line2); color:var(--text); padding:10px 12px; font-family:inherit; font-size:14px; }
.input:focus,.textarea:focus,.select:focus { border-color:var(--glow); outline:none; }
.textarea { resize:vertical; min-height:90px; }

/* FOOTER */
.footer { padding:48px 24px; border-top:1px solid var(--line); margin-top:96px; }
.footer .inner { max-width:1280px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; font-family:var(--mono); font-size:10px; letter-spacing:3px; color:var(--mute); }

/* MAP PAGE */
.map-app { display:grid; grid-template-rows:48px 1fr 36px; grid-template-columns:260px 1fr 280px; height:100vh; overflow:hidden; }
.map-app .header { grid-column:1/-1; display:flex; align-items:center; gap:16px; padding:0 18px; background:rgba(10,10,10,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.map-app .feed { grid-row:2; grid-column:1; border-right:1px solid var(--line); overflow-y:auto; background:rgba(10,10,10,.8); }
.map-app .mapwrap { grid-row:2; grid-column:2; position:relative; }
.map-app .ranks { grid-row:2; grid-column:3; border-left:1px solid var(--line); overflow-y:auto; background:rgba(10,10,10,.8); }
.map-app .telemetry { grid-column:1/-1; display:flex; align-items:center; gap:20px; padding:0 18px; background:rgba(10,10,10,.85); border-top:1px solid var(--line); font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); }
.map-app .telemetry .glow { color:var(--glow); }
.map-app .panel-head { padding:8px 14px; }
@media (max-width:1024px) { .map-app { grid-template-columns:1fr; grid-template-rows:48px 180px 1fr 36px; } .map-app .feed { grid-row:2; grid-column:1; border-right:0; border-bottom:1px solid var(--line); } .map-app .mapwrap { grid-row:3; grid-column:1; } .map-app .ranks { display:none; } }
@media (max-width:640px) {
  .map-app .telemetry { font-size:9px; gap:10px; padding:0 10px; overflow-x:auto; }
  .map-app .header { gap:8px; padding:0 12px; flex-wrap:wrap; }
  .map-app .header > a:not(.brand-mark) { font-size:9px; }
  .faction-chip { min-height:44px; }
  .faction-chip .fc-sigil { width:42px; min-width:42px; font-size:20px; }
  .faction-chip .fc-name { font-size:12px; }
  .faction-chip .fc-stats { font-size:9px; }
  /* Wall of Work — one column on phones */
  .work-card .stats > div { padding:6px 8px; }
  .work-card h3 { font-size:15px; }
  /* Hero typography down a notch */
  .hero h1 { font-size:clamp(40px, 11vw, 60px); letter-spacing:-1px; }
}

#map { position:absolute; inset:0; }
.map-app .mapwrap::after { content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 60%, rgba(10,10,10,.85) 100%); z-index:2; }

/* HUD doesn't want Mapbox chrome. NOTE: Mapbox TOS requires attribution on
   non-Enterprise plans — hiding these is at the account holder's discretion. */
.mapboxgl-ctrl-logo, .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right, .mapboxgl-ctrl-attrib { display: none !important; }
.mapboxgl-ctrl-top-right { display: none !important; }
.mapboxgl-canvas { outline: none; }

.marker {
  position:absolute; pointer-events:auto; cursor:pointer;
  width:28px; height:28px;
}
.marker .pulse { position:absolute; inset:0; border-radius:50%; }
.marker .core { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; }
.marker .ring { position:absolute; inset:0; border-radius:50%; border:1px solid; opacity:.85; }
.marker .label { position:absolute; left:50%; top:100%; margin-top:6px; transform:translateX(-50%); white-space:nowrap; font-family:var(--mono); font-size:10px; letter-spacing:2px; opacity:0; pointer-events:none; transition:.15s; background:rgba(10,10,10,.65); padding:2px 6px; border-radius:1px; backdrop-filter:blur(2px); }
.marker:hover .label { opacity:1; }
/* Top-3 by signal — label always visible for war-map leaderboard feel */
.marker.marker-top .label { opacity:1; text-shadow:0 0 8px currentColor; border:1px solid currentColor; background:rgba(10,10,10,.85); }

/* SPOTLIGHT MODE — when an operator is selected, dim everyone else */
.map-app[data-spotlight="on"] .marker:not(.marker-selected):not(.marker-ally) {
  opacity:0.22; filter:saturate(0.4) blur(0.5px); transition:.3s ease-out;
}
.map-app[data-spotlight="on"] .marker.marker-ally { opacity:0.85; transition:.3s; }
.map-app[data-spotlight="on"] .marker.marker-selected {
  z-index:5; opacity:1; transition:.3s;
}
.map-app[data-spotlight="on"] .marker.marker-selected .pulse { animation-duration:1s; opacity:1; }
.map-app[data-spotlight="on"] .marker.marker-selected .ring { border-width:2px; }
.map-app[data-spotlight="on"] .marker.marker-selected .label { opacity:1; }

.spotlight-card {
  position:absolute; top:20px; right:20px; z-index:9;
  width:300px; padding:16px;
  background:rgba(10,10,10,.95); backdrop-filter:blur(12px);
  border:1px solid var(--g, var(--glow));
  box-shadow:0 0 64px -12px color-mix(in srgb, var(--g, var(--glow)) 60%, transparent),
             inset 0 0 28px -8px color-mix(in srgb, var(--g, var(--glow)) 30%, transparent);
  animation: spotlight-in .25s ease-out;
}
@keyframes spotlight-in { from { transform:translateX(20px); opacity:0; } to { transform:none; opacity:1; } }
.spotlight-card .sc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:var(--mono); font-size:10px; color:var(--g, var(--glow)); letter-spacing:3px; }
.spotlight-card .sc-close { background:transparent; border:1px solid var(--line2); color:var(--mute); width:24px; height:24px; cursor:pointer; line-height:0; font-size:14px; padding:0; }
.spotlight-card .sc-close:hover { color:var(--text); border-color:var(--text); }
.spotlight-card .sc-name { font-family:var(--display); font-size:22px; font-weight:700; line-height:1.1; }
.spotlight-card .sc-handle { font-family:var(--mono); font-size:11px; color:var(--mute); margin-top:2px; }
.spotlight-card .sc-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; font-family:var(--mono); font-size:10px; }
.spotlight-card .sc-stats > div { display:flex; justify-content:space-between; padding:6px 8px; background:rgba(0,0,0,.4); border:1px solid var(--line2); }
.spotlight-card .sc-stats .sv { color:var(--g, var(--glow)); font-weight:600; }
.spotlight-card .sc-actions { margin-top:12px; display:flex; gap:8px; }

/* FEATURED OPERATOR BADGE — gold $ overlay echoes premium-cart icons */
.featured-badge {
  position:absolute; top:-2px; right:-2px;
  width:14px; height:14px; border-radius:50%;
  background:#fbbf24; color:#0a0a0a;
  font-family:var(--mono); font-size:9px; font-weight:700;
  display:grid; place-items:center; z-index:3;
  box-shadow: 0 0 12px rgba(251,191,36,.8), 0 0 4px rgba(251,191,36,1);
  pointer-events:none;
}

/* LAYER CONTROL RAIL */
.layer-control {
  position:absolute; top:20px; left:20px; z-index:8;
  display:flex; flex-direction:column; gap:4px;
  padding:8px; background:rgba(10,10,10,.85); backdrop-filter:blur(10px);
  border:1px solid var(--line); min-width:88px;
}
.layer-control .lc-head {
  font-family:var(--mono); font-size:9px; letter-spacing:3px;
  color:var(--glow); padding:0 4px 4px; border-bottom:1px solid var(--line);
}
.layer-control .lc-chip {
  font-family:var(--mono); font-size:10px; letter-spacing:2px;
  padding:6px 10px; border:1px solid var(--line2);
  background:transparent; color:var(--mute); cursor:pointer;
  transition:.12s ease-out;
}
.layer-control .lc-chip:hover { color:var(--text); border-color:var(--dim); }
.layer-control .lc-chip.on {
  color:var(--glow); border-color:var(--glow); background:var(--glowsoft);
  box-shadow: inset 0 0 12px -4px rgba(103,232,249,.5);
}
@media (max-width:640px) {
  .layer-control { top:auto; bottom:46px; left:6px; padding:5px; min-width:70px; }
  .layer-control .lc-chip { font-size:9px; padding:4px 8px; }
}

.pulse-ring { position:absolute; pointer-events:none; border-radius:50%; border:1px solid; transform:translate(-50%,-50%); }
.pulse-burst { position:absolute; pointer-events:none; left:0; top:0; width:12px; height:12px; margin-left:-6px; margin-top:-6px; border-radius:50%; }

.tt { position:absolute; pointer-events:none; z-index:30; width:280px; background:rgba(10,10,10,.95); backdrop-filter:blur(8px); border:1px solid rgba(103,232,249,.4); padding:14px; box-shadow:0 0 42px -12px rgba(103,232,249,.6); }
.tt-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:var(--mono); font-size:10px; color:var(--glow); letter-spacing:2px; }
.tt-name { font-family:var(--display); font-size:18px; }
.tt-handle { font-family:var(--mono); font-size:11px; color:var(--mute); margin-bottom:10px; }
.tt-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-family:var(--mono); font-size:10px; }
.tt-grid > div { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid rgba(38,38,46,.5); }
.tt-grid .v { color:var(--text); }
.tt-grid .va { color:var(--glow); }

/* ASCENSION */
.asc-overlay { position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(0,0,0,.75); animation:fadein .4s; }
.asc-card { position:relative; max-width:480px; padding:48px 56px; border:1px solid var(--glow); background:rgba(10,10,10,.95); text-align:center; box-shadow:0 0 120px -10px rgba(103,232,249,.6); }
.asc-burst { position:absolute; left:50%; top:50%; width:50vmin; height:50vmin; border-radius:50%; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(103,232,249,.4), transparent 70%); animation:burst 1.6s ease-out forwards; pointer-events:none; }
@keyframes burst { from{transform:translate(-50%,-50%) scale(.4); opacity:0} 25%{opacity:1} to{transform:translate(-50%,-50%) scale(2.5); opacity:0} }
@keyframes fadein { from{opacity:0} to{opacity:1} }
.asc-card .tag { display:block; font-family:var(--mono); font-size:11px; color:var(--glow); letter-spacing:4px; }
.asc-card .name { font-family:var(--display); font-size:32px; font-weight:700; margin:16px 0 4px; }
.asc-card .lbl { font-family:var(--mono); font-size:11px; color:var(--mute); letter-spacing:3px; margin-top:24px; }
.asc-card .rank { font-family:var(--mono); font-size:36px; letter-spacing:8px; margin-top:6px; }

/* TOAST */
.toast { position:fixed; bottom:24px; right:24px; z-index:60; background:rgba(10,10,10,.95); border:1px solid var(--glow); padding:12px 18px; font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--glow); box-shadow:0 0 32px -10px rgba(103,232,249,.6); }

.divider { height:1px; background:linear-gradient(to right, transparent, var(--line2), transparent); margin:24px 0; }
.glow-text { text-shadow:0 0 18px rgba(103,232,249,.4); }

/* PROGRESS */
.progress { height:4px; background:var(--s3); overflow:hidden; }
.progress > .bar { height:100%; background:linear-gradient(to right, var(--glow), var(--gold)); transition:width .5s; }

/* FACTION CHIP (war-map faction bar) */
.faction-chip {
  display:inline-flex; align-items:stretch; gap:0;
  text-decoration:none; cursor:pointer;
  border:1px solid color-mix(in srgb, var(--g) 55%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--g) 18%, rgba(10,10,10,.85)), color-mix(in srgb, var(--g) 8%, rgba(10,10,10,.85)));
  backdrop-filter: blur(10px);
  box-shadow:
    0 0 32px -6px color-mix(in srgb, var(--g) 55%, transparent),
    inset 0 0 18px -6px color-mix(in srgb, var(--g) 30%, transparent);
  transition: .15s ease-out;
  min-height: 54px;
  overflow:hidden;
  position:relative;
}
.faction-chip:hover {
  transform: translateY(-1px);
  box-shadow:
    0 0 48px -4px color-mix(in srgb, var(--g) 70%, transparent),
    inset 0 0 22px -4px color-mix(in srgb, var(--g) 45%, transparent);
}
.faction-chip .fc-sigil {
  display:grid; place-items:center;
  width:50px; min-width:50px;
  font-size:24px;
  color: var(--g);
  background: color-mix(in srgb, var(--g) 16%, transparent);
  border-right: 1px solid color-mix(in srgb, var(--g) 40%, transparent);
  text-shadow: 0 0 14px color-mix(in srgb, var(--g) 80%, transparent);
}
.faction-chip .fc-body { display:flex; flex-direction:column; justify-content:center; padding: 6px 18px 6px 14px; }
.faction-chip .fc-name { font-family: var(--display); font-size:14px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color: var(--text); line-height:1; }
.faction-chip .fc-stats { margin-top:5px; display:flex; gap:6px; font-family: var(--mono); font-size:10px; letter-spacing:1.5px; color: var(--dim); }
.faction-chip .fc-stats b { color: var(--g); font-weight:600; }
.faction-chip .fc-sep { color: var(--mute); }

/* SKELETON LOADERS — cinematic HUD placeholders */
@keyframes nro-skel-pulse {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 0.85; }
}
.skel {
  background: linear-gradient(90deg,
    rgba(38,38,46,0.55) 0%,
    rgba(52,52,62,0.85) 50%,
    rgba(38,38,46,0.55) 100%);
  background-size: 200% 100%;
  animation: nro-skel-pulse 1.6s ease-in-out infinite;
  border: 1px solid var(--line);
}
.skel-line { height: 12px; }
.skel-bar  { height: 28px; }
.skel-tile { aspect-ratio: 16/9; }
.skel-row  { display:flex; gap:12px; align-items:center; padding:12px; border-bottom:1px solid var(--line); }
.skel-stat { padding:16px; }
.skel-stat .skel-line:first-child { width: 60%; height:10px; margin-bottom:8px; }
.skel-stat .skel-line:last-child  { width: 80%; height:22px; }

.dossier-skeleton {
  display:grid; grid-template-columns:auto 1fr auto; gap:20px; padding:20px;
  align-items:center;
}
.dossier-skeleton .ds-avatar { width:96px; height:96px; }
.dossier-skeleton .ds-body { display:flex; flex-direction:column; gap:10px; }

/* RANK GLYPH MARKERS */
.glyph { width:100%; height:100%; display:grid; place-items:center; }
.glyph svg { width:100%; height:100%; display:block; filter: drop-shadow(0 0 6px currentColor); }

/* STREAK FLAME (visible when streak_days > 0) */
.streak-flame {
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--mono); color:#fbbf24;
}
.streak-flame::before {
  content:"🔥"; font-size:14px;
  text-shadow: 0 0 12px rgba(252,191,36,.7);
  animation: nro-flicker 1.4s ease-in-out infinite alternate;
}
@keyframes nro-flicker {
  0%   { opacity:.85; transform: translateY(0)    rotate(-2deg) scale(0.96); }
  50%  { opacity: 1;  transform: translateY(-1px) rotate(1deg)  scale(1.04); }
  100% { opacity:.92; transform: translateY(0)    rotate(-1deg) scale(0.98); }
}

/* REVENUE PULSE — high-MRR Wall-of-Work cards get a subtle gold accent */
.work-card.high-rev {
  border-color: rgba(251,191,36,.4);
  box-shadow: 0 0 38px -10px rgba(251,191,36,.45), inset 0 0 22px -10px rgba(251,191,36,.25);
}
.work-card.high-rev:hover {
  border-color: rgba(251,191,36,.7);
  box-shadow: 0 12px 48px -16px rgba(251,191,36,.7), inset 0 0 28px -8px rgba(251,191,36,.35);
}
.work-card.high-rev .cover { background-image: linear-gradient(135deg, rgba(251,191,36,.16), rgba(167,139,250,.08)); }

/* WALL OF WORK · portfolio card */
.work-card {
  display:flex; flex-direction:column;
  border:1px solid var(--line);
  background: linear-gradient(180deg, rgba(28,28,34,.85), rgba(17,17,20,.85));
  overflow:hidden; position:relative; transition:.18s;
}
.work-card:hover { border-color: var(--glow); transform: translateY(-2px); box-shadow: 0 12px 36px -16px rgba(103,232,249,.55); }
.work-card .cover {
  aspect-ratio: 16/9; background-size:cover; background-position:center;
  background-color: var(--s3);
  background-image: linear-gradient(135deg, rgba(103,232,249,.08), rgba(167,139,250,.06));
  border-bottom: 1px solid var(--line);
  position:relative;
}
.work-card .cover::after {
  content:""; position:absolute; inset:0;
  background: linear-gradient(to top, rgba(10,10,10,.5), transparent 40%);
}
.work-card .status-pill {
  position:absolute; top:8px; left:8px; z-index:2;
  font-family:var(--mono); font-size:9px; letter-spacing:2px; text-transform:uppercase;
  padding:3px 8px; border:1px solid; background:rgba(10,10,10,.7); backdrop-filter:blur(4px);
}
.work-card .body { padding:14px 16px; flex:1; display:flex; flex-direction:column; gap:6px; }
.work-card h3 { font-family:var(--display); font-size:17px; margin:0; }
.work-card .tagline { color:var(--dim); font-size:13px; line-height:1.45; }
.work-card .stack { display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; padding-top:10px; }
.work-card .stack span { border:1px solid var(--line2); padding:2px 7px; font-family:var(--mono); font-size:9px; color:var(--dim); }
.work-card .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line); border-top:1px solid var(--line); }
.work-card .stats > div { background: rgba(0,0,0,.3); padding:8px 10px; }
.work-card .stats .lbl { font-family:var(--mono); font-size:9px; letter-spacing:2px; color:var(--mute); text-transform:uppercase; }
.work-card .stats .val { font-family:var(--mono); font-size:14px; color:var(--glow); font-weight:600; margin-top:2px; }
.work-card .stats .val.gold { color:var(--gold); }
.work-card .stats .val.dim { color:var(--dim); }
.work-card .links { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); background:rgba(0,0,0,.25); }
.work-card .links a { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--dim); display:inline-flex; align-items:center; gap:6px; }
.work-card .links a:hover { color:var(--glow); }

/* COMMAND PALETTE */
.cmdk-overlay { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); display:grid; place-items:flex-start center; padding-top:14vh; animation:fadein .15s ease-out; }
.cmdk { width:min(640px,92vw); border:1px solid var(--glow); background:rgba(10,10,10,.96); box-shadow:0 0 80px -10px rgba(103,232,249,.5); position:relative; }
.cmdk::before, .cmdk::after { content:""; position:absolute; width:12px; height:12px; border:1px solid var(--glow); opacity:.8; }
.cmdk::before { top:-1px; left:-1px; border-right:0; border-bottom:0; }
.cmdk::after { bottom:-1px; right:-1px; border-left:0; border-top:0; }
.cmdk-head { padding:6px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
.cmdk-head .label { font-family:var(--mono); font-size:10px; color:var(--glow); letter-spacing:3px; }
.cmdk-head .hint { font-family:var(--mono); font-size:9px; color:var(--mute); letter-spacing:2px; margin-left:auto; }
.cmdk-input { width:100%; background:transparent; border:0; outline:none; padding:18px 18px; font-family:var(--mono); font-size:15px; color:var(--text); }
.cmdk-input::placeholder { color:var(--mute); }
.cmdk-results { max-height:50vh; overflow-y:auto; }
.cmdk-section-label { padding:8px 16px 4px; font-family:var(--mono); font-size:9px; letter-spacing:3px; color:var(--mute); }
.cmdk-item { display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer; border:0; background:transparent; width:100%; text-align:left; color:var(--text); font:inherit; }
.cmdk-item.active, .cmdk-item:hover { background:rgba(103,232,249,.08); }
.cmdk-item .glyph { width:28px; height:28px; display:grid; place-items:center; border:1px solid var(--line2); background:rgba(0,0,0,.4); font-family:var(--mono); font-size:11px; color:var(--dim); }
.cmdk-item .title { font-size:14px; }
.cmdk-item .sub { font-family:var(--mono); font-size:10px; color:var(--mute); }
.cmdk-item .right { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:2px; }
.cmdk-empty { padding:24px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--mute); letter-spacing:2px; }
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="scan"></div>
<div id="app">
  <noscript>
    <div style="max-width:600px;margin:120px auto;padding:24px;color:#9a9aa3;font-family:Inter,sans-serif;text-align:center">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#67e8f9;letter-spacing:4px">// SIGNAL OFFLINE</div>
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:36px;margin:16px 0;color:#e6e6ea">JavaScript required.</h1>
      <p>NRO runs entirely client-side. Enable JavaScript to access the Operator Grid.</p>
    </div>
  </noscript>
  <div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:transparent;z-index:50;transition:opacity .35s ease-out;opacity:1">
    <div style="text-align:center">
      <div style="display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#67e8f9;letter-spacing:4px">
        <span style="width:8px;height:8px;border-radius:50%;background:#67e8f9;animation:pulse 1.6s infinite"></span>
        // INITIALIZING OPERATOR CORE
      </div>
      <div style="margin-top:12px;font-family:'Space Grotesk',sans-serif;font-size:24px;color:#5a5a64">Standby…</div>
    </div>
    <style>@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }</style>
  </div>
</div>

<script>
window.__NRO_ENV = {
  SUPABASE_URL: "__SUPABASE_URL__",
  SUPABASE_ANON_KEY: "__SUPABASE_ANON_KEY__",
  MAPBOX_TOKEN: "__MAPBOX_TOKEN__",
  SITE_URL: "__SITE_URL__"
};

// Boot watchdog (P0-3): if the SPA hasn't mounted in 9s, swap the loader
// for a recovery UI so users aren't trapped on a spinner.
// Common causes: esm.sh CDN slow, Mapbox blocked, Supabase init throwing.
window.__NRO_BOOT_WATCHDOG = setTimeout(function() {
  var boot = document.getElementById("boot");
  if (!boot) return;
  boot.innerHTML =
    '<div style="max-width:540px;text-align:center;padding:24px;font-family:Inter,sans-serif">' +
      '<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#fbbf24;letter-spacing:4px">// SIGNAL DEGRADED</div>' +
      '<h2 style="font-family:\'Space Grotesk\',sans-serif;font-size:24px;margin:14px 0 6px;color:#e6e6ea">Operator Core is taking longer than expected.</h2>' +
      '<p style="color:#9a9aa3;font-size:14px;margin:0 0 20px">A third-party module (Mapbox, Supabase, or the esm.sh CDN) may be slow on your network. Try a refresh, or jump to the federation while we sort it out.</p>' +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button onclick="location.reload()" style="background:#67e8f9;color:#0a0a0a;border:0;padding:10px 18px;font-family:\'JetBrains Mono\',monospace;font-size:11px;letter-spacing:3px;cursor:pointer">RETRY</button>' +
        '<a href="https://nextrealmos.pages.dev/civilization" style="display:inline-block;background:transparent;color:#e6e6ea;border:1px solid #34343e;padding:10px 18px;font-family:\'JetBrains Mono\',monospace;font-size:11px;letter-spacing:3px;text-decoration:none">NROS · CIVILIZATION →</a>' +
      '</div>' +
    '</div>';
}, 9000);

// Cancel the watchdog when the SPA mounts (it removes the boot div).
new MutationObserver(function(muts, obs) {
  for (var i = 0; i < muts.length; i++) {
    var m = muts[i];
    for (var j = 0; j < m.removedNodes.length; j++) {
      if (m.removedNodes[j].id === "boot") {
        clearTimeout(window.__NRO_BOOT_WATCHDOG);
        obs.disconnect();
        return;
      }
    }
  }
}).observe(document.getElementById("app"), { childList: true });

// Surface module-load errors instantly instead of waiting for the watchdog.
window.addEventListener("error", function(e) {
  if (e.filename && /esm\.sh|mapbox|supabase/.test(e.filename)) {
    var boot = document.getElementById("boot");
    if (boot && !boot.dataset.errored) {
      boot.dataset.errored = "1";
      clearTimeout(window.__NRO_BOOT_WATCHDOG);
      boot.innerHTML =
        '<div style="max-width:520px;text-align:center;padding:24px;font-family:Inter,sans-serif">' +
          '<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#f87171;letter-spacing:4px">// MODULE LOAD FAILED</div>' +
          '<h2 style="font-family:\'Space Grotesk\',sans-serif;font-size:22px;margin:14px 0 6px;color:#e6e6ea">A dependency couldn\'t load.</h2>' +
          '<p style="color:#9a9aa3;font-size:13px;margin:0 0 20px">' + (e.filename || "unknown") + '<br><small>' + (e.message || "") + '</small></p>' +
          '<div style="display:flex;gap:10px;justify-content:center">' +
            '<button onclick="location.reload()" style="background:#67e8f9;color:#0a0a0a;border:0;padding:10px 18px;font-family:\'JetBrains Mono\',monospace;font-size:11px;letter-spacing:3px;cursor:pointer">RETRY</button>' +
            '<a href="https://nextrealmos.pages.dev/civilization" style="background:transparent;color:#e6e6ea;border:1px solid #34343e;padding:10px 18px;font-family:\'JetBrains Mono\',monospace;font-size:11px;letter-spacing:3px;text-decoration:none">NROS →</a>' +
          '</div>' +
        '</div>';
    }
  }
}, true);
</script>
<script type="module" src="/app.js"></script>
</body></html>
